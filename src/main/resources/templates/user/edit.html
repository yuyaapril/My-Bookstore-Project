<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<th:block th:insert="~{layouts/shares :: head }"></th:block>
  <body>
    <th:block th:insert="~{layouts/nav :: nav }"></th:block>

  <div class="container">
      <h1 class="text-center my-5">Users Role Edit</h1>

      <div class="row">
        <div class="col-md-6">
                <table class="table table-bordered">
<thead>
    <tr>
      <th scope="col">No</th>
      <th scope="col">Id</th>
      <th scope="col">Name</th>
      <th scope="col">Action</th>
    </tr>
  </thead>
  <tbody>

        <tr th:each="role:${roles}" th:if="${not #lists.contains(userRoles,role)}">
      <td >1</td>
      <td th:text="${role.id}">001</td>
      <td th:text="${role.name}">Role_Admin</td>
      <td>
        <a th:href="@{/users/add/role/{uid}/{rid}(uid=${userId},rid=${role.id})}" class="btn btn-sm btn-warning">
          <i class="fa fa-add"></i>
        </a>     
      </td>
    </tr> 
   
  </tbody>
</table>
        </div>
        <div class="col-md-6">
                <table class="table table-bordered">
<thead>
    <tr>
      <th scope="col">No</th>
      <th scope="col">Id</th>
      <th scope="col">Name</th>
      <th scope="col">Action</th>
    </tr>
  </thead>
  <tbody>
    <tr th:each="role : ${userRoles}">
      <td>1</td>
      <td th:text="${role.id}">001</td>
      <td th:text="${role.name}">Role_User</td>
      <td>
        <a th:href="@{/users/remove/role/{uid}/{rid}(uid=${userId},rid=${role.id})}" class="btn btn-sm btn-danger">
          <i class="fa fa-remove"></i>
        </a>     
      </td>
    </tr>  
   
  </tbody>
</table>
        </div>
      </div>

  </div>   
    <th:block th:insert="~{layouts/shares :: foot}"></th:block>
  </body>
</html>
