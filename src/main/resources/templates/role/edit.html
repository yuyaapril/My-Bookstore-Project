<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<th:block th:insert="~{layouts/shares :: head }"></th:block>
  <body>
    <th:block th:insert="~{layouts/nav :: nav }"></th:block>

  <div class="container my-5 pt-5">
    <h3 class="text-center my-3">Role Edit</h3>
    <div class="col-md-6 offset-md-3">
      <form th:action="@{/roles/edit/{id}(id=${role.id})}" method="post">

          <div class="mb-3">
          <label for="name" class="form-label">Role Name : </label>
          <input type="text" class="form-control" id="name" name="name" required
           th:value="${role.name}">
          </div>

          <div class="d-flex justify-content-between">
          <a href="/roles" class="btn btn-warning btn-sm">Cancel</a>
          <button type="submit" class="btn btn-primary btn-sm">Update</button>
          </div>       
     </form>
    </div>
  </div>  
    <th:block th:insert="~{layouts/shares :: foot}"></th:block>
  </body>
</html>
