<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<th:block th:insert="~{layouts/shares :: head }"></th>
  <body>
    <th:block th:insert="~{layouts/nav :: nav }"></th>

  <div class="container my-5 pt-5">
    <h3 class="text-center my-3">Add New Category</h3>
    <div class="col-md-6 offset-md-3">
      <form action="/login" method="post">

          <div class="mb-3">
          <label for="username" class="form-label">Category Name : </label>
          <input type="text" class="form-control" id="username" name="username" required>
          </div>

          <div class="d-flex justify-content-between">
          <a href="/roles" class="btn btn-warning btn-sm">Cancel</a>
          <button type="submit" class="btn btn-primary btn-sm">Add</button>
          </div>       
     </form>
    </div>
  </div>   
    <th:block th:insert="~{layouts/shares :: foot}"></th>
  </body>
</html>
