<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<th:block th:insert="~{layouts/shares :: head }"></th:block>
  <body>
    <th:block th:insert="~{layouts/nav :: nav }"></th:block>

  <div class="container">
    <div class="d-flex justify-content-between my-5">
      <h5 class="text-center">ALL Categories</h5>
      <div>
        <a href="/cats/add" class="btn btn-primary btn-sm">
          <i class="fa fa-add"></i>
        </a>
      </div>
    </div>
      
      <table class="table table-bordered">
<thead>
    <tr>
      <th scope="col">No</th>
      <th scope="col">Id</th>
      <th scope="col">Name</th>
      <th scope="col">Action</th>
    </tr>
  </thead>
  <tbody>
    <tr th:each="cat : ${cats}">
      <td>1</td>
      <td th:text="${cat.id}">1</td>
      <td th:text="${cat.name}">ITPEC</td>
      <td>
        <!--<a th:href="@{/cats/edit/1102" class="btn btn-sm btn-warning">
          <i class="fa fa-edit"></i>
        </a>-->
        <a th:href="@{/cats/edit/{id}(id=${cat.id})}" class="btn btn-sm btn-warning">
          <i class="fa fa-edit"></i>
        </a>

        <a th:href="@{/cats/drop/{id}(id=${cat.id})}" class="btn btn-sm btn-danger">
          <i class="fa fa-trash"></i>
        </a>       
      </td>
    </tr>  
  </tbody>
</table>
  </div>     
    <th:block th:insert="~{layouts/shares :: foot}"></th:block>
  </body>
</html>
